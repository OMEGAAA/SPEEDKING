<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロアジリティタイマー</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --panel: rgba(12, 16, 22, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --line-strong: rgba(255, 255, 255, 0.2);
      --text: #f2f5f9;
      --dim: #7b8594;
      --accent: #c6ff3d;
      --accent-2: #dcff8a;
      --accent-ink: #0c1200;
      --accent-glow: rgba(198, 255, 61, 0.45);
      --ok: #3ee8a4;
      --warn: #ffc23d;
      --err: #ff4d5e;
      --num: "Bahnschrift", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
      --ui: "Bahnschrift", "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      --cut: 10px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      position: relative;
      margin: 0;
      background:
        radial-gradient(70% 60% at 30% 42%, rgba(198, 255, 61, 0.06), transparent 70%),
        radial-gradient(120% 90% at 50% 30%, #0e131a 0%, var(--bg) 62%);
      color: var(--text);
      font-family: var(--ui);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    /* 背景: 走路のレーンを思わせる斜めストライプと上端のアクセントライン */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        repeating-linear-gradient(-62deg, transparent 0 46px, rgba(255, 255, 255, 0.018) 46px 48px),
        linear-gradient(180deg, transparent 0 70%, rgba(0, 0, 0, 0.5));
    }
    body::after {
      content: ''; position: fixed; top: 0; left: 0; right: 0; height: 3px; pointer-events: none;
      background: linear-gradient(90deg, var(--accent) 0 22%, rgba(198, 255, 61, 0.25) 22% 23%, transparent 23% 77%, rgba(255, 255, 255, 0.25) 77% 78%, var(--line-strong) 78%);
    }

    /* ---- 上部バー ---- */
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
    }
    .event-title {
      display: flex; align-items: center; gap: 12px;
      color: var(--text);
      font-family: var(--num); font-stretch: 75%;
      font-size: 20px; font-weight: 700; letter-spacing: .16em;
      white-space: nowrap;
    }
    .event-title::before {
      content: ''; width: 26px; height: 18px; flex: none;
      background: var(--accent);
      clip-path: polygon(38% 0, 100% 0, 62% 100%, 0 100%);
      box-shadow: 0 0 18px var(--accent-glow);
    }
    .top-right { display: flex; align-items: center; gap: 10px; }
    .state {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 700; letter-spacing: .08em;
      padding: 5px 12px 5px 10px; border-radius: 3px;
      border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
      background: rgba(255, 255, 255, 0.03);
    }
    .state::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7;
    }
    .state.online { color: var(--ok); border-color: rgba(62, 232, 164, 0.5); background: rgba(62, 232, 164, 0.08); }
    .state.online::before { opacity: 1; box-shadow: 0 0 10px var(--ok); }
    .state.arming { color: var(--warn); border-color: rgba(255, 194, 61, 0.55); background: rgba(255, 194, 61, 0.08); }
    .state.arming::before { opacity: 1; box-shadow: 0 0 10px var(--warn); }
    .state.err { color: var(--err); border-color: rgba(255, 77, 94, 0.55); background: rgba(255, 77, 94, 0.08); }
    .state.err::before { opacity: 1; }
    @keyframes statusBlink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: no-preference) {
      .state.arming::before { animation: statusBlink 1s steps(2, start) infinite; }
    }
    .settings { display: flex; gap: 10px; align-items: center; }
    .settings label {
      color: var(--dim); font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
      display: flex; align-items: center; gap: 6px;
    }
    .settings input,
    .settings select {
      background: rgba(255, 255, 255, 0.04); color: var(--text);
      border: 1px solid var(--line); border-radius: 3px;
      padding: 5px 8px; font-size: 13px; font-family: var(--num); font-weight: 600;
      transition: border-color .15s ease, background .15s ease;
    }
    .settings input:hover, .settings select:hover { border-color: var(--line-strong); }
    .settings input:focus, .settings select:focus { border-color: var(--accent); background: rgba(198, 255, 61, 0.06); outline: none; }
    .settings input#testName { width: 110px; }
    .settings input#finishCount { width: 48px; }
    .settings select option { background: #10151b; }

    /* ---- 中央: タイム ---- */
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 34vw);
      align-items: center;
      gap: clamp(18px, 3vw, 42px);
      width: 100%; min-height: 0; padding: 0 clamp(16px, 3vw, 44px);
    }
    .timer-panel {
      display: grid; place-content: center; justify-items: center;
      gap: clamp(8px, 2vh, 22px); min-width: 0; text-align: center;
    }
    #bigTime {
      font-family: var(--num);
      font-stretch: 75%;
      font-style: italic;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: min(19vw, 40vh);
      line-height: .92;
      letter-spacing: -.01em;
      color: var(--text);
      text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6);
      transition: color .25s ease, text-shadow .25s ease;
    }
    #bigTime .unit {
      font-size: .24em; color: var(--dim); font-weight: 600; font-style: normal;
      margin-left: .18em; letter-spacing: .1em;
    }
    #bigTime.waiting { color: rgba(242, 245, 249, 0.18); text-shadow: none; }
    #bigTime.final {
      color: var(--accent);
      text-shadow: 0 0 28px rgba(198, 255, 61, 0.45), 0 0 90px rgba(198, 255, 61, 0.25);
    }
    #bigTime.final .unit { color: var(--accent-2); }
    @keyframes lockPulse {
      0% { transform: scale(1); filter: brightness(1); }
      30% { transform: scale(1.05); filter: brightness(1.6); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    @media (prefers-reduced-motion: no-preference) {
      #bigTime.final { animation: lockPulse .5s cubic-bezier(.2, .8, .3, 1); }
    }

    /* 光電管ゲートインジケータ: 横切り1回 = ビーム1本が点灯 */
    #gates { display: flex; gap: clamp(8px, 1.4vw, 16px); }
    #gates .gate {
      width: clamp(14px, 2.2vw, 26px);
      height: clamp(22px, 5vh, 44px);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transform: skewX(-18deg);
      transition: background .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    #gates .gate.lit {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      border-color: var(--accent-2);
      box-shadow: 0 0 18px var(--accent-glow), 0 0 4px var(--accent);
    }
    #phase {
      font-size: clamp(13px, 2.2vh, 18px); font-weight: 700; color: var(--dim); letter-spacing: .24em;
    }
    #phase.final { color: var(--accent); }

    .latest-lap {
      position: relative;
      display: flex; justify-content: space-between; align-items: center;
      width: min(100%, 440px); min-height: 52px; padding: 8px 16px 8px 20px;
      border: 1px solid var(--line); border-left: 0;
      background: linear-gradient(90deg, rgba(198, 255, 61, 0.1), rgba(255, 255, 255, 0.02) 60%);
      color: var(--dim);
    }
    .latest-lap::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: var(--accent); box-shadow: 0 0 14px var(--accent-glow);
    }
    #latestLapLabel { font-size: 11.5px; font-weight: 700; letter-spacing: .2em; }
    .latest-lap-value {
      color: var(--text); font-family: var(--num); font-stretch: 75%; font-style: italic;
      font-variant-numeric: tabular-nums;
      font-size: clamp(26px, 3.8vh, 36px); font-weight: 700; line-height: 1;
    }
    .latest-lap-value .unit { margin-left: 5px; color: var(--dim); font-size: .45em; font-style: normal; }
    @keyframes lapFlash {
      0% { transform: scale(1); background-color: rgba(198, 255, 61, 0); }
      30% { transform: scale(1.03); background-color: rgba(198, 255, 61, 0.22); box-shadow: 0 0 30px rgba(198, 255, 61, .25); }
      100% { transform: scale(1); background-color: rgba(198, 255, 61, 0); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .latest-lap.flash { animation: lapFlash .55s ease; }
    }

    /* ---- 通過タイム / 区間ラップ ---- */
    .lap-panel {
      width: min(100%, 440px); overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel); text-align: left;
    }
    .lap-head, .lap-row {
      display: grid; grid-template-columns: 64px minmax(90px, 1fr) minmax(90px, 1fr);
      align-items: center; column-gap: 10px; padding: 6px 14px;
    }
    .lap-head {
      color: var(--dim); border-bottom: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.04);
      font-size: 10px; font-weight: 700; letter-spacing: .2em;
    }
    #lapRows { max-height: 122px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .lap-row {
      min-height: 30px; color: var(--dim); font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .lap-row:nth-child(even) { background: rgba(255, 255, 255, 0.015); }
    .lap-row:last-child { border-bottom: 0; }
    .lap-row.latest {
      color: var(--text);
      background: linear-gradient(90deg, rgba(198, 255, 61, 0.14), rgba(198, 255, 61, 0.02));
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .lap-number { font-family: var(--num); font-weight: 700; letter-spacing: .06em; }
    .lap-time {
      color: var(--text); font-family: var(--num); font-weight: 600; font-size: 15px;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .lap-row.latest .lap-time:last-child { color: var(--accent); }
    .lap-empty { padding: 10px 12px; color: var(--dim); font-size: 12px; text-align: center; letter-spacing: .06em; }

    /* ---- 下部: 操作バー ---- */
    footer {
      display: flex; justify-content: center; align-items: center;
      flex-wrap: wrap; gap: 12px; padding: 16px 20px 22px;
    }
    button {
      border: none; border-radius: 3px; cursor: pointer;
      padding: 9px 18px; font-size: 14px; font-weight: 700;
      font-family: inherit; letter-spacing: .06em;
      transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease;
    }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #measureBtn {
      min-width: 220px; padding: 13px 40px;
      background: var(--accent); color: var(--accent-ink);
      font-size: 17px; font-weight: 800; letter-spacing: .5em; text-indent: .5em;
      clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
      box-shadow: 0 0 0 rgba(198, 255, 61, 0);
    }
    #measureBtn:hover:not(:disabled) { background: var(--accent-2); }
    #measureBtn:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--accent-ink); }
    #testCrossingBtn {
      background: transparent; color: var(--dim); border: 1px dashed var(--line-strong);
    }

    #unsupported {
      display: none; color: var(--err); border: 1px solid var(--err); border-left-width: 5px;
      background: rgba(255, 77, 94, 0.08);
      padding: 10px 14px; margin: 10px 20px 0; font-size: 14px; font-weight: 700;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #cameraVisibilityBtn {
      padding: 6px 12px; border: 1px solid var(--line); border-radius: 3px;
      background: rgba(255, 255, 255, 0.04); color: var(--text);
      font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    #cameraVisibilityBtn:hover { border-color: var(--accent); color: var(--accent); }

    main.camera-hidden { grid-template-columns: minmax(0, 1fr); }
    main.camera-hidden .timer-panel { width: min(100%, 1000px); justify-self: center; }
    main.camera-hidden #bigTime { font-size: min(24vw, 42vh); }

    /* ---- Webカメラ / リプレイ ---- */
    .camera-panel {
      position: relative;
      min-width: 0; border: 1px solid var(--line);
      background: var(--panel); overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }
    .camera-panel::before {
      content: ''; position: absolute; left: 0; top: 0; width: 64px; height: 3px; z-index: 2;
      background: var(--accent); box-shadow: 0 0 12px var(--accent-glow);
    }
    .camera-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding: 10px 14px; color: var(--text);
      font-size: 11px; font-weight: 700; letter-spacing: .22em;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }
    #cameraStatus {
      display: flex; align-items: center; gap: 7px;
      color: var(--dim); font-size: 11px; letter-spacing: .08em;
    }
    #cameraStatus::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--dim);
    }
    #cameraStatus.live { color: var(--ok); }
    #cameraStatus.live::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    #cameraStatus.recording { color: #ff8a95; }
    #cameraStatus.recording::before { background: var(--err); box-shadow: 0 0 10px var(--err); }
    #cameraStatus.replay { color: var(--accent); }
    #cameraStatus.replay::before { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    @keyframes recBlink { 50% { opacity: .2; } }
    @media (prefers-reduced-motion: no-preference) {
      #cameraStatus.recording::before { animation: recBlink 1s steps(2, start) infinite; }
    }
    .camera-frame {
      position: relative; aspect-ratio: 16 / 9; width: 100%; background: #010203;
    }
    /* 放送用ファインダー風のコーナーブラケット */
    .camera-frame::after {
      content: ''; position: absolute; inset: 10px; pointer-events: none; z-index: 1;
      --c: rgba(255, 255, 255, 0.55);
      background:
        linear-gradient(var(--c), var(--c)) top left / 18px 2px,
        linear-gradient(var(--c), var(--c)) top left / 2px 18px,
        linear-gradient(var(--c), var(--c)) top right / 18px 2px,
        linear-gradient(var(--c), var(--c)) top right / 2px 18px,
        linear-gradient(var(--c), var(--c)) bottom left / 18px 2px,
        linear-gradient(var(--c), var(--c)) bottom left / 2px 18px,
        linear-gradient(var(--c), var(--c)) bottom right / 18px 2px,
        linear-gradient(var(--c), var(--c)) bottom right / 2px 18px;
      background-repeat: no-repeat;
    }
    .camera-frame video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      background: #010203;
    }
    #replayVideo { display: none; object-fit: contain; }
    .camera-empty {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding: 24px; color: var(--dim); font-size: 13px; text-align: center; letter-spacing: .04em;
      background: repeating-linear-gradient(-45deg, transparent 0 10px, rgba(255, 255, 255, 0.02) 10px 11px);
    }
    .camera-controls {
      display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px; padding: 10px; border-top: 1px solid var(--line);
    }
    .camera-controls select {
      min-width: 0; background: rgba(255, 255, 255, 0.04); color: var(--text);
      border: 1px solid var(--line); border-radius: 3px; padding: 7px 8px; font-family: inherit;
    }
    .camera-controls select:focus { border-color: var(--accent); outline: none; }
    .camera-controls button {
      padding: 7px 12px; font-size: 12px; color: var(--text);
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
    }
    .camera-controls button:hover:not(:disabled) { border-color: var(--line-strong); background: rgba(255, 255, 255, 0.09); }
    #replayBtn:not(:disabled) { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    #replayBtn:hover:not(:disabled) { background: var(--accent-2); }

    @media (max-width: 900px) {
      main { grid-template-columns: minmax(0, 1fr) minmax(260px, 38vw); gap: 14px; padding-inline: 16px; }
      #bigTime { font-size: min(18vw, 36vh); }
      .camera-controls { grid-template-columns: minmax(0, 1fr) auto; }
      #replayBtn { grid-column: 1 / -1; }
    }
  </style>
</head>

<body>
  <header>
    <div class="event-title">プロアジリティタイマー</div>
    <div class="top-right">
      <span id="state" class="state">未接続</span>
      <div class="settings">
        <label>モード<select id="modeSelect">
          <option value="pro-agility-2_5" selected>2.5m-2.5m</option>
          <option value="pro-agility-5">5m-5m</option>
        </select></label>
        <label>テスト名<input type="text" id="testName" value="Proagility2"></label>
        <label>完了回数<input type="number" id="finishCount" value="4" min="1" max="20" step="1"></label>
        <button id="cameraVisibilityBtn" type="button" aria-controls="cameraPanel" aria-pressed="true">カメラを非表示</button>
      </div>
    </div>
  </header>

  <div id="unsupported">このブラウザは WebHID 非対応です。Chrome か Edge で開いてください。</div>

  <main id="displayMain">
    <section class="timer-panel" aria-label="計測タイマー">
      <div id="bigTime" class="waiting">--<span class="unit">秒</span></div>
      <div id="gates"></div>
      <div id="phase">計測ボタンで開始</div>
      <div id="latestLap" class="latest-lap" aria-live="polite">
        <span id="latestLapLabel">直近ラップ</span>
        <strong id="latestLapTime" class="latest-lap-value">--<span class="unit">秒</span></strong>
      </div>
      <div class="lap-panel" aria-label="通過タイムと区間ラップ">
        <div class="lap-head" aria-hidden="true">
          <span>通過</span><span style="text-align:right">累計</span><span style="text-align:right">ラップ</span>
        </div>
        <div id="lapRows" aria-live="polite"></div>
      </div>
    </section>

    <aside id="cameraPanel" class="camera-panel" aria-label="Webカメラと計測リプレイ">
      <div class="camera-head">
        <span>WEB CAMERA</span>
        <span id="cameraStatus">カメラ停止中</span>
      </div>
      <div class="camera-frame">
        <video id="liveVideo" autoplay muted playsinline></video>
        <video id="replayVideo" controls playsinline></video>
        <div id="cameraEmpty" class="camera-empty">カメラを開始すると、ここにライブ映像が表示されます</div>
      </div>
      <div class="camera-controls">
        <select id="cameraSelect" aria-label="使用するWebカメラ">
          <option value="">既定のカメラ</option>
        </select>
        <button id="cameraBtn" type="button">カメラ開始</button>
        <button id="replayBtn" type="button" disabled>リプレイを見る</button>
      </div>
    </aside>
  </main>

  <footer>
    <button id="measureBtn">計測</button>
    <button id="testCrossingBtn" type="button" hidden>疑似通過</button>
  </footer>

  <script type="module">
    import {
      buildTestStart, scanFrames, parseError, parseTestResultEvent, BaseCmd, WittyCmd,
    } from './witty-protocol.js';

    const $ = (id) => document.getElementById(id);

    if (!('hid' in navigator)) { $('unsupported').style.display = 'block'; }

    let device = null;
    let mode = 'disconnected'; // disconnected | idle | arming | online
    let wantArm = false;       // 再列挙をまたいで「開始したい」意思を保持
    let armAttempts = 0;
    const MAX_ARM_ATTEMPTS = 5;
    // 測定モードのプリセット。テスト名はWittyタイマーに登録済みの名称に合わせる。
    const MODES = {
      'pro-agility-2_5': { testName: 'Proagility2', finishCount: 4 },
      'pro-agility-5': { testName: 'Proagility', finishCount: 2 },
    };
    const DEFAULT_FINISH_CROSSING_COUNT = MODES['pro-agility-2_5'].finishCount;
    const CAMERA_STORAGE_KEY = 'witty-display-camera-id';
    const CAMERA_VISIBLE_STORAGE_KEY = 'witty-display-camera-visible';
    const TEST_CAMERA_MODE = new URLSearchParams(location.search).has('testCamera');
    let currentRun = [];
    let lastAnimatedLapCount = 0;
    let cameraStream = null;
    let cameraStartPromise = null;
    let mediaRecorder = null;
    let finishRecordingTimer = null;
    let replayUrl = null;
    let replayMode = false;
    let cameraVisible = localStorage.getItem(CAMERA_VISIBLE_STORAGE_KEY) !== 'false';

    function getFinishCrossingCount() {
      const parsed = Math.floor(Number($('finishCount').value));
      if (!Number.isFinite(parsed)) return DEFAULT_FINISH_CROSSING_COUNT;
      return Math.min(20, Math.max(1, parsed));
    }

    function log(msg) { console.log(`[witty-display] ${msg}`); }

    // --- Webカメラ / 計測リプレイ ---
    function setCameraStatus(text, cls = '') {
      const status = $('cameraStatus');
      status.textContent = text;
      status.className = cls;
    }

    function setCameraEmpty(text, visible = true) {
      $('cameraEmpty').textContent = text;
      $('cameraEmpty').style.display = visible ? 'grid' : 'none';
    }

    function setCameraControlsRecording(recording) {
      $('cameraSelect').disabled = recording;
      $('cameraBtn').disabled = recording;
    }

    function showLiveVideo() {
      replayMode = false;
      $('replayVideo').pause();
      $('replayVideo').style.display = 'none';
      $('liveVideo').style.display = 'block';
      $('replayBtn').textContent = 'リプレイを見る';
      setCameraEmpty('', Boolean(!cameraStream));
      if (mediaRecorder?.state === 'recording') setCameraStatus('REC 計測を録画中', 'recording');
      else if (cameraStream) setCameraStatus('LIVE', 'live');
    }

    function showReplayVideo() {
      if (!replayUrl) return;
      replayMode = true;
      $('liveVideo').style.display = 'none';
      $('replayVideo').style.display = 'block';
      $('replayVideo').src = replayUrl;
      $('replayBtn').textContent = 'ライブに戻る';
      setCameraEmpty('', false);
      setCameraStatus('REPLAY', 'replay');
      $('replayVideo').currentTime = 0;
      $('replayVideo').play().catch(() => { /* 再生ボタンから手動再生できる */ });
    }

    function clearReplay() {
      replayMode = false;
      $('replayBtn').disabled = true;
      $('replayBtn').textContent = 'リプレイを見る';
      $('replayVideo').pause();
      $('replayVideo').removeAttribute('src');
      $('replayVideo').load();
      if (replayUrl) URL.revokeObjectURL(replayUrl);
      replayUrl = null;
      showLiveVideo();
    }

    function getRecordingOptions() {
      const mimeTypes = [
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm',
      ];
      const mimeType = mimeTypes.find((type) => MediaRecorder.isTypeSupported(type));
      return mimeType ? { mimeType, videoBitsPerSecond: 4_000_000 } : { videoBitsPerSecond: 4_000_000 };
    }

    function stopActiveRecording(keepReplay) {
      clearTimeout(finishRecordingTimer);
      finishRecordingTimer = null;
      const recorder = mediaRecorder;
      if (!recorder || recorder.state === 'inactive') return Promise.resolve();
      recorder.keepReplay = keepReplay;
      return new Promise((resolve) => {
        recorder.addEventListener('stop', resolve, { once: true });
        try { recorder.stop(); }
        catch (error) { log('録画停止エラー: ' + error.message); resolve(); }
      });
    }

    async function startRunRecording() {
      clearTimeout(finishRecordingTimer);
      finishRecordingTimer = null;
      if (cameraStartPromise) await cameraStartPromise.catch(() => {});
      await stopActiveRecording(false);
      clearReplay();

      const videoTrack = cameraStream?.getVideoTracks().find((track) => track.readyState === 'live');
      if (!videoTrack || !('MediaRecorder' in window)) {
        if (!cameraStream) setCameraStatus('カメラ未接続');
        return;
      }

      const chunks = [];
      let recorder;
      try {
        recorder = new MediaRecorder(cameraStream, getRecordingOptions());
      } catch (error) {
        setCameraControlsRecording(false);
        setCameraStatus('録画を開始できません', 'err');
        log('録画開始エラー: ' + error.message);
        return;
      }
      recorder.keepReplay = false;
      recorder.addEventListener('dataavailable', (event) => {
        if (event.data?.size) chunks.push(event.data);
      });
      recorder.addEventListener('stop', () => {
        if (mediaRecorder === recorder) mediaRecorder = null;
        setCameraControlsRecording(false);
        if (recorder.keepReplay && chunks.length) {
          const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
          if (replayUrl) URL.revokeObjectURL(replayUrl);
          replayUrl = URL.createObjectURL(blob);
          $('replayBtn').disabled = false;
          setCameraStatus('リプレイ準備完了', 'live');
          log(`リプレイ準備完了 (${Math.round(blob.size / 1024)} KB)`);
        } else if (cameraStream) {
          setCameraStatus('LIVE', 'live');
        }
      });
      mediaRecorder = recorder;
      recorder.start(250);
      setCameraControlsRecording(true);
      showLiveVideo();
      log('計測映像の録画開始');
    }

    function finishRunRecording() {
      if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
      setCameraStatus('REC 終了映像を記録中', 'recording');
      clearTimeout(finishRecordingTimer);
      finishRecordingTimer = setTimeout(() => {
        stopActiveRecording(true).catch((error) => log('録画停止エラー: ' + error.message));
      }, 1000);
    }

    async function populateCameraSelect(selectedDeviceId = '') {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter((device) => device.kind === 'videoinput');
      const select = $('cameraSelect');
      select.innerHTML = '';
      cameras.forEach((camera, index) => {
        const option = document.createElement('option');
        option.value = camera.deviceId;
        option.textContent = camera.label || `Webカメラ ${index + 1}`;
        select.appendChild(option);
      });
      if (!cameras.length) {
        select.add(new Option('Webカメラなし', ''));
        return;
      }
      const available = cameras.some((camera) => camera.deviceId === selectedDeviceId);
      select.value = available ? selectedDeviceId : cameras[0].deviceId;
      localStorage.setItem(CAMERA_STORAGE_KEY, select.value);
    }

    async function startCamera(deviceId = '') {
      if (!navigator.mediaDevices?.getUserMedia) {
        setCameraEmpty('この環境ではWebカメラを使用できません');
        setCameraStatus('カメラ非対応');
        return;
      }
      if (cameraStartPromise) return cameraStartPromise;
      cameraStartPromise = (async () => {
        setCameraStatus('カメラ準備中…', 'arming');
        setCameraEmpty('Webカメラに接続しています…');
        await stopActiveRecording(false);
        cameraStream?.getTracks().forEach((track) => track.stop());
        cameraStream = null;

        if (TEST_CAMERA_MODE) {
          const canvas = document.createElement('canvas');
          canvas.width = 1280; canvas.height = 720;
          const context = canvas.getContext('2d');
          let frame = 0;
          const draw = () => {
            if (!cameraStream) return;
            const hue = (frame++ * 2) % 360;
            context.fillStyle = `hsl(${hue} 45% 16%)`;
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = '#f7f3ea';
            context.font = '700 54px Segoe UI';
            context.fillText('CAMERA TEST', 48, 82);
            context.fillStyle = '#e7bd56';
            context.fillRect(48 + ((frame * 9) % 1000), 260, 150, 150);
            requestAnimationFrame(draw);
          };
          cameraStream = canvas.captureStream(30);
          draw();
          $('cameraSelect').innerHTML = '<option value="">疑似Webカメラ</option>';
        }

        if (!TEST_CAMERA_MODE) {
          const video = {
            width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 },
          };
          if (deviceId) video.deviceId = { exact: deviceId };
          try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
          } catch (error) {
            if (deviceId && ['OverconstrainedError', 'NotFoundError'].includes(error.name)) {
              cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } },
                audio: false,
              });
            } else {
              throw error;
            }
          }
        }
        $('liveVideo').srcObject = cameraStream;
        await $('liveVideo').play().catch(() => {});
        if (!TEST_CAMERA_MODE) {
          const activeId = cameraStream.getVideoTracks()[0]?.getSettings().deviceId || deviceId;
          await populateCameraSelect(activeId);
        }
        $('cameraBtn').textContent = 'カメラ停止';
        showLiveVideo();
        log('Webカメラ接続');
      })().catch((error) => {
        const messages = {
          NotAllowedError: 'カメラの使用が許可されていません',
          NotFoundError: 'Webカメラが見つかりません',
          NotReadableError: 'Webカメラを他のアプリが使用中です',
        };
        const message = messages[error.name] || `カメラを開始できません: ${error.message}`;
        setCameraEmpty(message);
        setCameraStatus('カメラエラー', 'err');
        $('cameraBtn').textContent = '再試行';
        log(message);
        throw error;
      }).finally(() => { cameraStartPromise = null; });
      return cameraStartPromise;
    }

    async function stopCamera() {
      await stopActiveRecording(false);
      cameraStream?.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      $('liveVideo').srcObject = null;
      $('cameraBtn').textContent = 'カメラ開始';
      setCameraStatus('カメラ停止中');
      if (replayMode && replayUrl) showReplayVideo();
      else setCameraEmpty('カメラを開始すると、ここにライブ映像が表示されます');
    }

    async function setCameraVisible(visible, { persist = true, restart = true } = {}) {
      cameraVisible = Boolean(visible);
      $('displayMain').classList.toggle('camera-hidden', !cameraVisible);
      $('cameraPanel').hidden = !cameraVisible;
      $('cameraVisibilityBtn').textContent = cameraVisible ? 'カメラを非表示' : 'カメラを表示';
      $('cameraVisibilityBtn').setAttribute('aria-pressed', String(cameraVisible));

      if (persist) localStorage.setItem(CAMERA_VISIBLE_STORAGE_KEY, String(cameraVisible));

      if (!cameraVisible) {
        if (cameraStartPromise) await cameraStartPromise.catch(() => {});
        await stopCamera();
      } else if (restart && !cameraStream) {
        await startCamera(localStorage.getItem(CAMERA_STORAGE_KEY) || '').catch(() => {});
      }
    }

    $('cameraVisibilityBtn').addEventListener('click', async () => {
      $('cameraVisibilityBtn').disabled = true;
      try {
        await setCameraVisible(!cameraVisible);
      } finally {
        $('cameraVisibilityBtn').disabled = false;
      }
    });

    $('cameraBtn').addEventListener('click', async () => {
      if (cameraStream) await stopCamera();
      else await startCamera(localStorage.getItem(CAMERA_STORAGE_KEY) || '').catch(() => {});
    });

    $('cameraSelect').addEventListener('change', async () => {
      const deviceId = $('cameraSelect').value;
      localStorage.setItem(CAMERA_STORAGE_KEY, deviceId);
      await startCamera(deviceId).catch(() => {});
    });

    $('replayBtn').addEventListener('click', () => {
      if (replayMode) showLiveVideo();
      else showReplayVideo();
    });

    function setState(text, cls) { const s = $('state'); s.textContent = text; s.className = 'state' + (cls ? ' ' + cls : ''); }
    function setMode(m) {
      mode = m;
      const btn = $('measureBtn');
      btn.disabled = (m === 'arming');
      if (m === 'online') { setState('計測中', 'online'); btn.textContent = '計測'; }
      else if (m === 'arming') { setState('計測開始中…', 'arming'); btn.textContent = '開始中…'; }
      else if (m === 'idle') { setState('接続済み(未開始)'); btn.textContent = '計測'; }
      else { setState('未接続'); btn.textContent = '計測'; }
    }

    // --- HID 受信処理 ---
    function onInputReport(e) {
      const data = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
      if (data.every(b => b === 0xff)) return; // アイドル
      const frames = scanFrames(data);
      for (const f of frames) handleFrame(f);
    }

    function handleFrame(f) {
      if (f.command === BaseCmd.ERROR) {
        const err = parseError(f.payload);
      if (err && err.failedCommand === WittyCmd.SET_TEST_START) {
          wantArm = false;
          stopActiveRecording(false).catch(() => {});
          setMode('idle');
          setState('開始失敗: テスト名を確認 (code ' + err.errorCode + ')', 'err');
        }
        return;
      }
      if (f.command === WittyCmd.SET_TEST_START && f.isResponse) {
        wantArm = false; armAttempts = 0;
        setMode('online');
        log('計測開始 受理(オンライン計測モード)');
        return;
      }
      if (f.command === WittyCmd.EVENT_TEST_RESULTS) {
        const ev = parseTestResultEvent(f.payload);
        if (ev) onCrossing(ev);
      }
    }

    // --- 横切り処理(witty-measure.html と同じ判定ロジック) ---
    function onCrossing(ev) {
      const last = currentRun[currentRun.length - 1];
      if (last && last.tick === ev.tick && last.counter === ev.counter) return; // 重複
      if (last && ev.tick < last.tick) currentRun = [];  // タイマー側で新しい走が始まった
      currentRun.push(ev);
      render();
      startLiveClock();
      if (currentRun.length === getFinishCrossingCount()) finishRunRecording();
      log(`横切り#${currentRun.length} tick=${ev.tick}`);
    }

    // --- 表示 ---
    function render() {
      const finishCount = getFinishCrossingCount();
      const big = $('bigTime');
      const phase = $('phase');
      const done = Math.min(currentRun.length, finishCount);
      const finished = currentRun.length >= finishCount;

      renderGates(finishCount, done);
      renderLatestLap(finishCount);
      renderLaps(finishCount);
      if (currentRun.length === 0 || finished) stopLiveClock();

      if (currentRun.length === 0) {
        big.className = 'waiting';
        big.innerHTML = '--<span class="unit">秒</span>';
        phase.className = '';
        phase.textContent = (mode === 'online') ? 'スタート待ち' : '計測ボタンで開始';
        return;
      }

      // タイムは witty-measure.html と同じ方式(tickの絶対秒をそのまま表示)。
      // 走ごとのタイムリセットは、計測ボタンで計測開始コマンドを再送して行う。
      if (finished) {
        const official = currentRun[finishCount - 1].seconds;
        big.className = 'final';
        big.innerHTML = `${official.toFixed(2)}<span class="unit">秒</span>`;
        phase.className = 'final';
        phase.textContent = '確定タイム';
      } else {
        const latest = currentRun[currentRun.length - 1].seconds;
        big.className = '';
        big.innerHTML = `${latest.toFixed(2)}<span class="unit">秒</span>`;
        phase.className = '';
        phase.textContent = `計測中 ${done}/${finishCount}`;
      }
    }

    // --- リアルタイム表示 ---
    // Witty は通過の瞬間しかタイムを送らないため、通過と通過の間は PC の時計で経過時間を足して表示する。
    // 次の通過イベントが届いた時点で Witty の正式な値に差し替わる(表示用の目安で、記録には使わない)。
    const LAP_HOLD_MS = 600; // 通過直後は確定したラップをこの時間だけ見せてからカウントアップに切り替える
    let liveAnchor = null;   // { seconds: 最後の通過のtick秒, at: その受信時刻(performance.now) }
    let liveFrame = 0;

    function startLiveClock() {
      cancelAnimationFrame(liveFrame);
      const last = currentRun[currentRun.length - 1];
      if (!last || currentRun.length >= getFinishCrossingCount()) { liveAnchor = null; return; }
      liveAnchor = { seconds: last.seconds, at: performance.now() };
      liveFrame = requestAnimationFrame(drawLiveClock);
    }

    function stopLiveClock() {
      cancelAnimationFrame(liveFrame);
      liveAnchor = null;
    }

    function drawLiveClock() {
      if (!liveAnchor) return;
      const sinceCrossing = performance.now() - liveAnchor.at;
      const elapsed = sinceCrossing / 1000;
      $('bigTime').innerHTML = `${(liveAnchor.seconds + elapsed).toFixed(2)}<span class="unit">秒</span>`;
      if (sinceCrossing >= LAP_HOLD_MS) {
        $('latestLapLabel').textContent = `ラップ #${currentRun.length + 1} 計測中`;
        $('latestLapTime').innerHTML = `${elapsed.toFixed(2)}<span class="unit">秒</span>`;
      }
      liveFrame = requestAnimationFrame(drawLiveClock);
    }

    function getLapSeconds(events, index) {
      if (index <= 0) return events[0]?.seconds ?? null;
      return Math.max(0, events[index].seconds - events[index - 1].seconds);
    }

    function renderLatestLap(finishCount) {
      const events = currentRun.slice(0, finishCount);
      const box = $('latestLap');
      const label = $('latestLapLabel');
      const value = $('latestLapTime');

      if (!events.length) {
        lastAnimatedLapCount = 0;
        label.textContent = '直近ラップ';
        value.innerHTML = '--<span class="unit">秒</span>';
        box.classList.remove('flash');
        return;
      }

      const index = events.length - 1;
      const lapSeconds = getLapSeconds(events, index);
      label.textContent = index === 0 ? '1回目タイム' : `直近ラップ #${index + 1}`;
      value.innerHTML = `${lapSeconds.toFixed(2)}<span class="unit">秒</span>`;

      if (events.length !== lastAnimatedLapCount) {
        lastAnimatedLapCount = events.length;
        box.classList.remove('flash');
        void box.offsetWidth;
        box.classList.add('flash');
      }
    }

    function renderLaps(finishCount) {
      const rows = $('lapRows');
      const events = currentRun.slice(0, finishCount);
      rows.innerHTML = '';

      if (!events.length) {
        const empty = document.createElement('div');
        empty.className = 'lap-empty';
        empty.textContent = '通過するとラップタイムが表示されます';
        rows.appendChild(empty);
        return;
      }

      events.forEach((event, index) => {
        const lap = getLapSeconds(events, index);
        const row = document.createElement('div');
        row.className = 'lap-row' + (index === events.length - 1 ? ' latest' : '');

        const number = document.createElement('span');
        number.className = 'lap-number';
        number.textContent = `#${index + 1}`;

        const cumulative = document.createElement('span');
        cumulative.className = 'lap-time';
        cumulative.textContent = `${event.seconds.toFixed(2)} 秒`;

        const interval = document.createElement('span');
        interval.className = 'lap-time';
        interval.textContent = `${lap.toFixed(2)} 秒`;

        row.append(number, cumulative, interval);
        rows.appendChild(row);
      });
      rows.scrollTop = rows.scrollHeight;
    }

    function renderGates(total, lit) {
      const box = $('gates');
      box.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const g = document.createElement('div');
        g.className = 'gate' + (i < lit ? ' lit' : '');
        box.appendChild(g);
      }
    }

    // --- 接続・開始の自動化(witty-measure.html と同じシーケンス) ---
    async function attachDevice(dev) {
      device = dev;
      if (!device.opened) await device.open();
      device.removeEventListener('inputreport', onInputReport);
      device.addEventListener('inputreport', onInputReport);
      log(`接続: ${device.productName || '(名称なし)'} PID=0x${device.productId.toString(16)}`);
    }

    async function sendStart() {
      if (!device) return;
      try {
        const frame = buildTestStart($('testName').value);
        await device.sendReport(0, frame);
        log(`計測開始コマンド送信 (試行${armAttempts})`);
      } catch (e) {
        log('送信失敗: ' + e.message + '(再列挙中かもしれません)');
      }
    }

    async function arm() {
      wantArm = true; armAttempts = 1;
      setMode('arming');
      await startRunRecording();
      if (TEST_CAMERA_MODE) {
        wantArm = false;
        setMode('online');
        return;
      }
      await sendStart();
    }

    $('measureBtn').addEventListener('click', async () => {
      if (mode === 'online') {
        // 表示をクリアし、計測開始コマンドを再送してタイマーのタイムをリセット
        currentRun = []; render();
        await arm();
        return;
      }
      if (mode === 'idle') { await arm(); return; }
      // 未接続 → 接続してそのまま計測開始
      try {
        const devs = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x16d0 }] });
        if (!devs.length) return;
        await attachDevice(devs[0]);
        await arm();
      } catch (e) { log('接続エラー: ' + e.message); setState('接続失敗', 'err'); }
    });

    // 再列挙対応: 切断されても開始意思があれば待ち受け
    navigator.hid && navigator.hid.addEventListener('disconnect', (e) => {
      if (device && e.device === device) {
        device = null;
        if (wantArm || mode === 'online') {
          setState('再接続待ち…', 'arming');
          log('切断 — 再接続を待機します');
        } else { setMode('disconnected'); }
      }
    });

    navigator.hid && navigator.hid.addEventListener('connect', async (e) => {
      if (device || e.device.vendorId !== 0x16d0) return;
      if (!wantArm && mode !== 'online') return;
      log('タイマー再出現 — 自動再接続します');
      try {
        await attachDevice(e.device);
        if (wantArm && armAttempts < MAX_ARM_ATTEMPTS) {
          armAttempts++;
          setMode('arming');
          setTimeout(sendStart, 500); // 起動直後は少し待ってから
        } else if (wantArm) {
          stopActiveRecording(false).catch(() => {});
          wantArm = false; setState('開始できませんでした(再試行上限)', 'err'); setMode('idle');
        } else {
          setMode('online');
        }
      } catch (err) { log('自動再接続失敗: ' + err.message); }
    });

    $('finishCount').addEventListener('input', render);
    $('modeSelect').addEventListener('change', () => {
      const preset = MODES[$('modeSelect').value];
      if (!preset) return;
      $('testName').value = preset.testName;
      $('finishCount').value = preset.finishCount;
      render();
      log(`測定モード変更: ${$('modeSelect').value === 'pro-agility-5' ? '5m-5m' : '2.5m-2.5m'} (テスト名=${preset.testName}, 完了回数=${preset.finishCount})`);
    });

    // 実機なしで表示を確認するための検証用フック(本番動作には影響しない)
    window.__simulateCrossing = (seconds) => {
      const counter = (currentRun[currentRun.length - 1]?.counter ?? 0) + 1;
      onCrossing({ tick: Math.round(seconds * 25000), counter, seconds });
    };

    if (TEST_CAMERA_MODE) {
      let testSeconds = 0;
      $('testCrossingBtn').hidden = false;
      $('testCrossingBtn').addEventListener('click', () => {
        testSeconds += 1.25;
        window.__simulateCrossing(testSeconds);
      });
    }

    setMode(TEST_CAMERA_MODE ? 'online' : 'disconnected');
    render();
    setCameraVisible(cameraVisible, { persist: false, restart: false });
    if (cameraVisible) startCamera(localStorage.getItem(CAMERA_STORAGE_KEY) || '').catch(() => {});
  </script>
</body>

</html>
